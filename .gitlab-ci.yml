# Pipeline: type check → API smoke as quality gate on every merge request →
# full API regression on main and on the nightly schedule.
stages:
  - verify
  - test
  - mobile

default:
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  CI: "true"

typecheck:
  stage: verify
  script:
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.api_test:
  stage: test
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test-results/junit.xml
    paths:
      - playwright-report/

# Quality gate: a red smoke run blocks the merge request.
api:smoke:
  extends: .api_test
  script:
    - npm run test:smoke
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

api:regression:
  extends: .api_test
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Template – not executed in this demo. Mobile E2E needs an Android emulator
# (KVM-enabled runner) or a device cloud. This variant uploads the app build
# and the flows to Maestro Cloud; it only runs when an API key and an APK are
# provided. Check the flags against your Maestro CLI version.
mobile:maestro:
  stage: mobile
  image: eclipse-temurin:17-jdk
  before_script:
    - curl -fsSL "https://get.maestro.mobile.dev" | bash
    - export PATH="$PATH:$HOME/.maestro/bin"
  script:
    - maestro cloud --api-key "$MAESTRO_CLOUD_API_KEY" "$APP_APK_PATH" maestro/
  rules:
    - if: $MAESTRO_CLOUD_API_KEY && $APP_APK_PATH
      when: manual
  allow_failure: true
